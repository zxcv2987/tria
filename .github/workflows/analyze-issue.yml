# Tria 이슈 분석 워크플로
#
# 필요한 저장소 Secret:
# - TRIA_READER_CLIENT_ID / TRIA_READER_PRIVATE_KEY — 대상 저장소 checkout용 GitHub App
# - CALLBACK_SECRET — packages/runner가 Tria Callback API를 호출할 때 쓰는 공유 secret
#   (apps/web의 CALLBACK_SECRET과 반드시 같은 값이어야 한다)
# - OPENAI_API_KEY — codex CLI 세션이 없는 이 환경에서 자동 로그인에 쓰는 OpenAI API 키
#   (platform.openai.com에서 발급)
#
# payload.repositoryName / ref 는 워크플로에서 추가 검증하지 않는다.
# Tria 서버(web-api)가 프로젝트 설정에서 검증한 값만 보낸다는 전제다.

name: Analyze Issue

on:
  repository_dispatch:
    types: [analyze-issue]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tria
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # GitHub App 설치 토큰 (문서 8.2)
      # repositoryOwner는 Tria 자신의 owner와 다를 수 있다 (다른 조직 레포 분석 지원).
      # TRIA_READER App이 해당 owner/repo에도 설치되어 있어야 한다.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TRIA_READER_CLIENT_ID }}
          private-key: ${{ secrets.TRIA_READER_PRIVATE_KEY }}
          owner: ${{ github.event.client_payload.repositoryOwner }}
          repositories: ${{ github.event.client_payload.repositoryName }}

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repositoryOwner }}/${{ github.event.client_payload.repositoryName }}
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ steps.app-token.outputs.token }}
          path: target
          persist-credentials: false

      # packages/runner 실행 계약 (runner 트랙과 공유하는 고정 env 이름)
      - name: Run packages/runner
        env:
          ANALYSIS_RUN_ID: ${{ github.event.client_payload.analysisRunId }}
          ISSUE_TITLE: ${{ github.event.client_payload.issueTitle }}
          ISSUE_BODY: ${{ github.event.client_payload.issueBody }}
          TARGET_REPOSITORY_PATH: ${{ github.workspace }}/target
          CALLBACK_URL: ${{ github.event.client_payload.callbackUrl }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pnpm --filter runner start

      # packages/runner 실행 전(App 토큰 발급, 대상 저장소 checkout 등) 단계에서
      # 실패하면 runner가 아예 못 떠서 콜백을 못 보낸다 — 그 경우 QUEUED에 영원히
      # 멈추므로, 이 job의 어느 단계든 실패하면 여기서 직접 FAILED 콜백을 보낸다.
      - name: Report workflow failure to Tria
        if: failure()
        run: |
          curl -sf -X POST "${{ github.event.client_payload.callbackUrl }}" \
            -H "Authorization: Bearer ${{ secrets.CALLBACK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{
              "analysisRunId": "${{ github.event.client_payload.analysisRunId }}",
              "status": "FAILED",
              "failureReason": "GitHub Actions 워크플로 실패: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'
